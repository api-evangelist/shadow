outcome: no-provider-served-well-known-document
note: >-
  Every /.well-known/ path was probed on every Shadow host. Shadow serves NO well-known discovery
  document of its own. Two failure modes are recorded here because both are the kind of thing that gets
  miscounted as a hit. First, gpu-instances.shadow.tech answers HTTP 200 for EVERY /.well-known/* path
  with the same HTML page — a language-detect redirect shell titled "Shadow GPU - Redirecting..." — so
  those 200s are a catch-all, not documents. Second, drive.shadow.tech does serve a real
  security.txt at 200, but it is the default file shipped with Nextcloud (the software Shadow Drive is
  built on): its Contact and Policy point at hackerone.com/nextcloud, and it expired on 2024-08-31.
  It evidences Nextcloud's disclosure programme, not Shadow's.
  CONSEQUENCE: no WellKnown pointer and no SecurityTxt pointer is emitted in apis.yml. This file is a
  recorded absence, which is valid data — it must not be read as a presence.
