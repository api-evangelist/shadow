generated: '2026-08-17'
method: searched
source: https://gpu-instances.shadow.tech/docs/cli-guide/
first_party: false
pointer_emitted: false
note: >-
  Shadow does NOT ship a CLI. What it publishes is a seven-page guide to driving Shadow GPU with the
  upstream OpenStack client, plus the Adjutant-backed user-management commands its platform enables.
  That guide is real provider documentation and is captured here, but no `type: CLI` pointer is emitted
  in apis.yml, because the cli_present check asserts the provider ships a first-party CLI and Shadow
  does not. Recording the command surface without claiming authorship of the binary is the honest
  reading.
binary:
  name: openstack
  distribution: python-openstackclient (PyPI, OpenInfra Foundation)
  version_seen: 10.2.1 (2026-07-15)
  catalogued_in: packages/shadow-packages.yml
install:
  documented_by_shadow: true
  prerequisites:
  - Python 3.8 or later
  - Access to the Shadow GPU PaaS dashboard
  steps:
  - python3 -m venv openstack-cli
  - source openstack-cli/bin/activate
  - pip install python-openstackclient
  recommendation: 'Shadow recommends installing inside a virtual environment "to avoid conflicts with
    other Python packages".'
  source: https://gpu-instances.shadow.tech/docs/cli-guide/configuration/
configuration:
  file: ~/.config/openstack/clouds.yaml
  obtained_from: 'Dashboard User Menu (👤) → "Get clouds.yaml file" → select "Password Type"'
  alternate: openrc.sh (shell environment file, same menu)
  select_cloud: export OS_CLOUD=<your-cloud-name>
  default_cloud_name: openstack
  verify: openstack image list
  gate: >-
    The credential file cannot be generated by API or CLI — a human must log into the dashboard to
    download it. This is the hard gate on automating Shadow GPU from a cold start.
command_surface:
  note: >-
    Shadow's CLI guide is organised by capability rather than by command reference; the commands below
    are the ones it actually prints. Everything else is upstream OpenStack command surface Shadow does
    not restate.
  guides:
  - {page: Openstack CLI Configuration, url: https://gpu-instances.shadow.tech/docs/cli-guide/configuration/}
  - {page: User Management with CLI, url: https://gpu-instances.shadow.tech/docs/cli-guide/user-management/}
  - {page: Networking with CLI, url: https://gpu-instances.shadow.tech/docs/cli-guide/networking/}
  - {page: Security Measures, url: https://gpu-instances.shadow.tech/docs/cli-guide/security-measures/}
  - {page: Security Groups, url: https://gpu-instances.shadow.tech/docs/cli-guide/security-groups/}
  - {page: Managing Images, url: https://gpu-instances.shadow.tech/docs/cli-guide/build-images/}
  - {page: Load Balancing, url: https://gpu-instances.shadow.tech/docs/cli-guide/load-balancing/}
  commands:
  - command: openstack image list
    group: images
    purpose: Verify CLI configuration and list available images
  - command: openstack role assignment list --user <your-user-id> --project <your-project-id>
    group: identity
    purpose: Confirm which roles your user holds on a project
  - command: openstack project user list
    group: identity
    purpose: List all users associated with the current project, including pending invitations
    note: 'Shadow describes this as the CLI equivalent of the dashboard User Management table.'
  - command: openstack project user invite <email-address> <role-name>
    group: identity
    purpose: Invite a user to the project via Adjutant, granting a named Keystone role
    requires: project_mod or project_admin, and Adjutant enabled in the environment
  - command: 'openstack admin task token submit <invitation-token> ''{"password": "<initial-password>"}'''
    group: identity
    purpose: Complete an invitation entirely from the CLI, for dashboard-less or automated environments
    note: 'Documented as an advanced path using Adjutant''s admin task interface. The invitation token is
      the path segment after /token/ in the invitation email URL.'
platform_extensions:
  service: Adjutant
  client: python-adjutantclient (PyPI, not named by the Shadow docs)
  provides: [project user list, project user invite, admin task token submit]
  note: >-
    These subcommands are not part of base python-openstackclient — they come from the Adjutant client
    plugin, and Shadow lists "Adjutant is enabled in your environment" as a prerequisite without telling
    the reader which package supplies the commands. That is the one genuine documentation gap in an
    otherwise usable CLI guide.
