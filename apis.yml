apis:
- aid: shadow-gpu-openstack
  name: Shadow GPU (OpenStack API)
  description: 'Shadow GPU is Shadow''s sovereign GPU cloud, delivered as a curated OpenStack 2024.1
    deployment rather than a bespoke REST API. Every programmatic action — launching NVIDIA RTX 2000
    Ada or RTX A4500 GPU instances, attaching Cinder volumes, wiring Neutron networks and Octavia
    load balancers, managing Barbican secrets, reading CloudKitty usage — is performed against the
    standard OpenStack service APIs. Authentication is Keystone: a domain-scoped user (user#domain)
    or, for automation, an Application Credential, delivered as a clouds.yaml or openrc.sh downloaded
    from the dashboard. The Keystone identity endpoint answers anonymously and self-identifies at
    https://auth.<region>.os.shadow.tech/v3; the rest of the service catalog is returned only inside
    an authenticated token response, so per-service endpoints are not publicly enumerable. Shadow
    publishes no OpenAPI document for this surface and points users to the upstream OpenStack API
    reference.'
