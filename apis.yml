aid: shadow
name: Shadow
description: 'Shadow is a French cloud computing company founded in 2015, launched commercially in
  2016, and chaired by OVHcloud founder Octave Klaba. It streams complete high-end Windows desktops
  (Shadow PC, Shadow PC Pro), sells Nextcloud-based storage as Shadow Drive, and sells sovereign GPU
  compute as Shadow GPU — an OpenStack 2024.1 platform running across seven regions in France,
  Germany, the United States and Canada. Shadow GPU is programmable only through the standard
  OpenStack API: a Keystone v3.14 identity endpoint answers anonymously at
  https://auth.<region>.os.shadow.tech/v3, fronting Nova (compute), Neutron and Octavia
  (networking / load balancing), Designate (DNS), Cinder and Glance (storage and images), Placement,
  Barbican (secrets), CloudKitty (rating) and the Skyline / Horizon dashboards, driven with the
  upstream openstack CLI, Terraform, Ansible, Pulumi or Cluster API. Shadow publishes no OpenAPI,
  AsyncAPI, first-party SDK, MCP server or A2A agent card of its own.'
