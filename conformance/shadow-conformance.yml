compliance_program:
  published: false
  note: >-
    No trust centre, certification list, or compliance page was found. Probed shadow.tech/security,
    /trust, /compliance, /us/security/, /us/responsible-disclosure/ (all 404) and
    trust.shadow.tech / security.shadow.tech (both NXDOMAIN). The Shadow GPU landing page makes an
    unsourced marketing claim of "100% Enterprise grade security" and describes the offering as
