generated: '2026-08-17'
method: searched
source: https://gpu-instances.shadow.tech/docs/getting-started/architecture/
note: >-
  Assessed from Shadow's own documentation plus live anonymous probes. Shadow publishes no OpenAPI,
  so nothing here is derived from a spec. The single strongest conformance signal is that Shadow GPU
  is a real OpenStack deployment whose Keystone endpoint answers with an OpenStack Identity API v3.14
  version document on all seven regions.
standards:
- id: openstack-identity-v3
  name: OpenStack Identity API v3 (Keystone)
  conforms: true
  version: v3.14
  evidence: >-
    Probed 2026-08-17. GET https://auth.<region>.os.shadow.tech/v3 returns 200 with
    {"version":{"id":"v3.14","status":"stable","updated":"2020-04-07T00:00:00Z", ...}} and media type
    application/vnd.openstack.identity-v3+json, on all seven documented regions.
- id: openstack-2024.1
  name: OpenStack 2024.1 (Caracal) service set
  conforms: true
  evidence: >-
    Shadow's Platform Architecture page enumerates Keystone, Nova, Nova Metadata, Neutron, Octavia,
    Designate, Cinder, Glance, Placement, Barbican, CloudKitty and Skyline; the docs link
    https://docs.openstack.org/2024.1/user/ as the user reference.
  caveat: >-
    Partial by the provider's own statement — "not all of these features have been configured or
    enabled in the Shadow Cloud environment", and "if a feature or capability is not explicitly
    documented in our knowledge base, it should be assumed that it is not available". Known gap:
    volume snapshots are not supported.
- id: openstack-application-credentials
  name: Keystone Application Credentials
  conforms: true
  evidence: Documented as the recommended mechanism for authenticating applications and scripts,
    with project scoping, role selection, optional expiry and independent revocation.
- id: openstack-rbac
  name: Keystone role-based access control
  conforms: true
  evidence: Seven named project roles published with their Keystone role names (member, project_mod,
    project_admin, load-balancer_observer, load-balancer_member, creator, observer).
- id: cluster-api-openstack
  name: Kubernetes Cluster API (CAPO)
  conforms: true
  evidence: Shadow publishes a Cluster API section — image building, control-plane creation, and
    worker-pool creation on OpenStack.
  source: https://gpu-instances.shadow.tech/docs/gpu-paas/cluster-api/
- id: terraform-openstack-provider
  name: Terraform (OpenStack provider)
  conforms: true
  evidence: 'Shadow lists Terraform, Ansible and Pulumi as supported IaC paths on the Shadow GPU
    landing page ("IaC — Terraform · Ansible · Pulumi").'
- id: openapi
  name: OpenAPI
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document found. Probed /openapi.json, /openapi.yaml, /swagger.json,
    /api-docs, /docs, /redoc against shadow.tech, gpu-instances.shadow.tech,
    api.<region>.os.shadow.tech, auth.<region>.os.shadow.tech and portal.<region>.os.shadow.tech —
    all 404 or an HTML shell. Shadow refers integrators to the upstream OpenStack API reference.
- id: graphql
