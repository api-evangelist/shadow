- language: hcl
  registry: terraform
  name: terraform-provider-openstack/openstack
  url: https://registry.terraform.io/providers/terraform-provider-openstack/openstack/latest
  install: 'terraform { required_providers { openstack = { source = "terraform-provider-openstack/openstack" } } }'
  version: 3.4.0
  published: '2025-11-11'
  official: false
  first_party: false
  vendor: OpenStack Terraform provider maintainers
  note: >-
    Shadow advertises Terraform support on the Shadow GPU landing page ("IaC — Terraform · Ansible ·
    Pulumi") and the CI/CD guide describes provisioning Shadow instances as Kubernetes worker nodes
    with it, but publishes no Shadow-specific provider, module, or example repository.
