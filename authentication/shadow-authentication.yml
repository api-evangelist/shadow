authorization:
  model: Keystone role-based access control, project-scoped
  note: >-
    Shadow GPU has no OAuth 2.0 scope surface; authorization is expressed as Keystone role
    assignments on a project. Roles below are quoted from Shadow's own documentation with the
    Keystone role names it publishes.
  roles:
  - label: Member
    keystone_role: member
    description: Access to all project services, but cannot invite others or modify roles.
  - label: Project Moderator
    keystone_role: project_mod
    description: Can invite users and update their roles, but cannot change the project admin.
  - label: Project Administrator
    keystone_role: project_admin
    description: Complete management of the project, including user invitations and role assignments.
  - label: Load Balancer Reader
    keystone_role: load-balancer_observer
    description: Can view load balancers and their configurations.
  - label: Load Balancer Member
    keystone_role: load-balancer_member
    description: Can manage load balancers and their configurations.
  - label: Secret Creator
    keystone_role: creator
    description: Can create and manage secrets.
  - label: Secret Reader
    keystone_role: observer
    description: Can view secrets.
  verify_command: openstack role assignment list --user <your-user-id> --project <your-project-id>
  source: https://gpu-instances.shadow.tech/docs/getting-started/project-management/
user_provisioning:
  service: Adjutant (OpenStack project-user invitation workflow)
  cli: openstack project user invite <email-address> <role-name>
  list: openstack project user list
  note: >-
    Invitations are completed by the invitee through the dashboard (choose an initial password). An
    advanced CLI-only path exists for automation via Adjutant's admin task interface
    (openstack admin task token submit <invitation-token> '{"password": "..."}'). Requires
    project_mod or project_admin.
  source: https://gpu-instances.shadow.tech/docs/cli-guide/user-management/
