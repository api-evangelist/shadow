note: >-
  Shadow publishes no OpenAPI document, so this profile could not be derived mechanically. It was
  read from Shadow GPU's own documentation and confirmed against a live anonymous probe of the
  Keystone identity endpoint. Shadow GPU is a curated OpenStack 2024.1 deployment, so its
  authentication model IS the OpenStack Keystone v3 model — there is no Shadow-specific token
  scheme, API-key header, or OAuth 2.0 authorization server.
summary:
  types:
  - keystone-password
  - keystone-application-credential
  api_key_in: []
  oauth2_flows: []
  standard: OpenStack Identity API v3 (Keystone)
  identity_api_version: v3.14
  probed_anonymously: true
schemes:
- name: Keystone password (domain-scoped user)
  type: password
  protocol: OpenStack Identity API v3
  description: >-
    Interactive and CLI authentication uses a domain-scoped username of the form user#domain (the
    docs give the example "user#mycompany-domain") plus a password, against the region's Keystone
    identity endpoint. The dashboard emits a ready-made clouds.yaml (Password Type) or openrc.sh
    which the operator saves to ~/.config/openstack/clouds.yaml and selects with the OS_CLOUD
    environment variable.
  credential_delivery:
  - clouds.yaml (downloaded from the dashboard User Menu, "Get clouds.yaml file")
  - openrc.sh (shell environment file, same menu)
  source: https://gpu-instances.shadow.tech/docs/cli-guide/configuration/
  recommended_for: interactive / human operators
- name: Keystone Application Credential
  type: application-credential
  protocol: OpenStack Identity API v3
  description: >-
    The documented mechanism for authenticating applications and scripts without sharing the
    primary account password. Created in the dashboard User Center under "Application Credentials"
    with a name, an optional expiration date, and a selected set of roles. Shadow's docs state the
    benefits verbatim as limited scope (restricted to specific projects), fine-grained access
    control (exact roles and permissions), easy revocation (deleted without affecting the main
    account), reduced risk (a compromise affects only that credential), and auditing (easier to
    track which application or script is making specific API calls).
  rotation_guidance: 'Documented best practice: "Regularly audit and rotate your application credentials."'
  revocation: Delete Application Credential from the Application Credentials page
  source: https://gpu-instances.shadow.tech/docs/getting-started/security-measures/
  recommended_for: automation, third-party applications, scripts, CI/CD
